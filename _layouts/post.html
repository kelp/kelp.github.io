---
layout: default
---
<article class="post" itemscope itemtype="http://schema.org/BlogPosting" style="view-transition-name: post-{{ page.id | slugify }}">

  <header class="post-header">
    <h1 class="post-title" itemprop="name headline" style="view-transition-name: title-{{ page.id | slugify }}">{{ page.title | escape }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">
        {{ page.date | date: "%b %-d, %Y" }}
      </time>
      {% if page.author %}
        • <span itemprop="author" itemscope itemtype="http://schema.org/Person"><span itemprop="name">{{ page.author }}</span></span>
      {% endif %}
    </p>
  </header>

  <div class="post-content" itemprop="articleBody">
    {{ content }}
  </div>
  
  <div class="post-navigation">
    <a href="{{ site.baseurl }}/" class="back-to-home">← Back to Home</a>
  </div>

</article>
